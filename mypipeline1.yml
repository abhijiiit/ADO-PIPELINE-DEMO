trigger: none
pr: none

parameters:
- name: Environment
  displayName: 'Environment'
  type: string
  default: 'DEV'
  values:
    - DEV
    - ITG
    - PROD
    - Pre-Prod

pool:
  vmImage: 'ubuntu-latest'

steps:
- bash: |
    echo "Deploying to ${{ parameters.Env }}"
  displayName: 'Display selected environment'
