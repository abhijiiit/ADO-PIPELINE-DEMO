name: Check Folder Before ADO Trigger

on:
  push:
    branches:
      - DevOps-feature-Branch

permissions:
  contents: read

jobs:
  check-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Test Folder
        id: folder_check
        shell: bash
        run: |
          if [ -d "Test_folder" ]; then
            echo "Test_folder exists."
            echo "Do not trigger Azure DevOps pipeline."
            echo "trigger_ado=false" >> "$GITHUB_OUTPUT"
          else
            echo "Test_folder does not exists."
            echo "Azure DevOps pipeline can be triggered."
            echo "trigger_ado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Display trigger decision
        shell: bash
        run: |
          echo "Trigger ADO: ${{steps.folder_check.outputs.trigger_ado }}"

      - name: Trigger Azure DevOps Pipeline
        if: ${{ false }}
       # if: steps.folder_check.outputs.trigger_ado == 'true'
        shell: bash
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --user ":$AZURE_DEVOPS_PAT" \
            --header "Content-Type: application/json" \
            --data "{\"resources\":{\"repositories\":{\"self\":{\"refName\":\"refs/heads/${GITHUB_REF_NAME}\"}}}}" \
            "https://dev.azure.com/abhijitCICD/My%20CICD/_apis/pipelines/1/runs?api-version=7.1"
